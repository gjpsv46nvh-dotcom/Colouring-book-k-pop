<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>K-POP Demon Hunters Colouring</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#27145d,#0b4b9b 55%,#7b1a85);color:#fff;min-height:100vh}
header{padding:14px 18px;text-align:center;font-weight:1000;font-size:clamp(22px,4vw,40px);text-shadow:0 3px 0 #55208b}header small{display:block;font-size:13px;font-weight:700}
.app{display:grid;grid-template-columns:190px 1fr 180px;gap:12px;padding:12px;max-width:1400px;margin:auto}.panel{background:#17215ddd;border:2px solid #75d6ff;border-radius:22px;padding:10px;box-shadow:0 10px 30px #0005}
.gallery{display:grid;gap:8px;max-height:78vh;overflow:auto}.thumb{background:white;color:#17215d;border:3px solid transparent;border-radius:14px;padding:5px;font-weight:900;text-align:center}.thumb.active{border-color:#ff65cf}.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:9px}
.stage{background:#fff;border-radius:24px;overflow:hidden;min-height:65vh;display:flex;align-items:center;justify-content:center;touch-action:none}.stage canvas{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;touch-action:none}
.tools button{width:100%;padding:12px;margin:5px 0;border:0;border-radius:14px;font-weight:900;color:#17215d}.tools h3{margin:10px 0 6px}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.swatch{aspect-ratio:1;border-radius:50%;border:3px solid white}.swatch.on{outline:4px solid #ff72d7}.sizes{display:flex;gap:8px}.sizes button{padding:9px}
@media(max-width:800px){.app{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(3,1fr);max-height:none}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.tools h3,.swatches,.sizes{grid-column:1/-1}.stage{order:-1;min-height:auto}}
</style></head><body><header>K-POP DEMON HUNTERS <span style="color:#ff7dde">COLOURING BOOK</span><small>Choose a page • tap an enclosed area to fill • or use the brush</small></header>
<div class="app"><aside class="panel gallery" id="gallery"></aside><main class="stage"><canvas id="c" width="900" height="900"></canvas></main>
<aside class="panel tools"><button id="fill">🪣 FILL MODE</button><button id="brush">🖌️ BRUSH</button><button id="eraser">⬜ ERASER</button><button id="undo">↩️ UNDO</button><button id="clear">🗑️ CLEAR PAGE</button><button id="save">⬇️ SAVE PICTURE</button><h3>BRUSH SIZE</h3><div class="sizes"><button data-s="8">S</button><button data-s="18">M</button><button data-s="34">L</button></div><h3>COLOURS</h3><div class="swatches" id="swatches"></div></aside></div>
<script>
const PAGES=[["GROUP", "group.png"], ["HUNTR/X", "huntrx.png"], ["RUMI", "rumi.png"], ["MIRA", "mira.png"], ["ZOEY", "zoey.png"], ["JINU", "jinu.png"], ["SAJA BOYS", "saja-boys.png"], ["DERPY", "derpy.png"], ["TEAM", "team.png"]];
const C=document.getElementById('c'),X=C.getContext('2d',{willReadFrequently:true}),gallery=document.getElementById('gallery');
let page=0,base=null,color='#ff5ab7',mode='fill',size=18,drawing=false,last=null,history=[];
const COLORS=['#ffcf33','#ff922e','#ff5353','#ff5ab7','#e66be8','#a83de0','#6556e8','#3878ef','#24a8ef','#27cfe8','#37d95b','#10b950','#079447','#7cab35','#b97a35','#8b5a35','#111111','#ffffff'];
function push(){history.push(C.toDataURL());if(history.length>12)history.shift()}
function load(i){page=i;history=[];[...gallery.children].forEach((e,n)=>e.classList.toggle('active',n===i));let im=new Image();im.onload=()=>{X.fillStyle='white';X.fillRect(0,0,900,900);X.drawImage(im,0,0,900,900);base=X.getImageData(0,0,900,900);push()};im.src=PAGES[i][1]}
PAGES.forEach((p,i)=>{let d=document.createElement('div');d.className='thumb';d.innerHTML=`<img src="${p[1]}"><div>${p[0]}</div>`;d.onclick=()=>load(i);gallery.appendChild(d)});
const sw=document.getElementById('swatches');COLORS.forEach((v,i)=>{let b=document.createElement('button');b.className='swatch'+(i===3?' on':'');b.style.background=v;b.onclick=()=>{color=v;[...sw.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};sw.appendChild(b)});
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),255]}
function pos(e){let r=C.getBoundingClientRect();return [Math.floor((e.clientX-r.left)*900/r.width),Math.floor((e.clientY-r.top)*900/r.height)]}
function flood(sx,sy){
 let im=X.getImageData(0,0,900,900),d=im.data,idx=(sy*900+sx)*4;
 // Don't paint black outline pixels.
 if(d[idx]<80&&d[idx+1]<80&&d[idx+2]<80)return;
 let target=[d[idx],d[idx+1],d[idx+2]],fill=hex(color);if(Math.abs(target[0]-fill[0])<5&&Math.abs(target[1]-fill[1])<5&&Math.abs(target[2]-fill[2])<5)return;
 push();let q=[[sx,sy]],seen=new Uint8Array(810000),tol=42,count=0;
 while(q.length&&count<500000){let [x,y]=q.pop(),k=y*900+x;if(x<0||y<0||x>=900||y>=900||seen[k])continue;seen[k]=1;let j=k*4,r=d[j],g=d[j+1],b=d[j+2];
   if(r<85&&g<85&&b<85)continue;
   if(Math.abs(r-target[0])>tol||Math.abs(g-target[1])>tol||Math.abs(b-target[2])>tol)continue;
   d[j]=fill[0];d[j+1]=fill[1];d[j+2]=fill[2];d[j+3]=255;count++;q.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
 }X.putImageData(im,0,0)
}
function stroke(a,b){X.strokeStyle=mode==='eraser'?'white':color;X.lineWidth=size;X.lineCap='round';X.lineJoin='round';X.beginPath();X.moveTo(...a);X.lineTo(...b);X.stroke();if(base){X.save();X.globalCompositeOperation='source-over';X.putImageData(base,0,0);X.restore()}}
C.addEventListener('pointerdown',e=>{let p=pos(e);if(mode==='fill'){flood(...p);return}push();drawing=true;last=p;C.setPointerCapture(e.pointerId);e.preventDefault()});
C.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);X.strokeStyle=mode==='eraser'?'white':color;X.lineWidth=size;X.lineCap='round';X.beginPath();X.moveTo(...last);X.lineTo(...p);X.stroke();last=p;e.preventDefault()});
C.addEventListener('pointerup',()=>{drawing=false;last=null});
fill.onclick=()=>mode='fill';brush.onclick=()=>mode='brush';eraser.onclick=()=>mode='eraser';
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>size=+b.dataset.s);
undo.onclick=()=>{if(history.length<2)return;history.pop();let im=new Image();im.onload=()=>{X.clearRect(0,0,900,900);X.drawImage(im,0,0)};im.src=history[history.length-1]};
clear.onclick=()=>load(page);save.onclick=()=>{let a=document.createElement('a');a.download='my-colouring.png';a.href=C.toDataURL('image/png');a.click()};load(0);
</script></body></html>
